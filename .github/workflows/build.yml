name: Build app

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run regression tests
        run: npm test

      - name: Typecheck and build production app
        run: npm run build

      - name: Install test browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Test hosted and offline startup
        run: npm run test:browser

      - name: Upload production bundle
        uses: actions/upload-artifact@v7
        with:
          name: vector-app-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14
